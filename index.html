<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grade 12 Examination</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      min-height:100vh;
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:linear-gradient(135deg,#f5f8ff 0%,#eef3ff 45%,#ffffff 100%);
      color:#172033;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:28px 18px;
    }
    .page{width:min(980px,100%);text-align:center}
    .badge{
      display:inline-flex;align-items:center;gap:8px;
      padding:8px 14px;border-radius:999px;
      background:#fff;border:1px solid #e5eaf5;
      box-shadow:0 8px 25px rgba(30,55,100,.07);
      font-size:13px;font-weight:700;color:#52617a;
      margin-bottom:14px;
    }
    h1{font-size:clamp(28px,5vw,46px);line-height:1.1;margin-bottom:9px}
    .subtitle{color:#66738a;font-size:15px;margin-bottom:30px}
    .subjects{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:18px;
    }
    .subject{
      appearance:none;border:1px solid #e4e9f3;background:#fff;
      border-radius:22px;padding:26px 18px 22px;
      min-height:180px;cursor:pointer;text-decoration:none;color:inherit;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      box-shadow:0 12px 35px rgba(37,57,91,.08);
      transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease;
    }
    .subject:hover{transform:translateY(-5px);box-shadow:0 18px 42px rgba(37,57,91,.14);border-color:#b9c8e8}
    .subject:active{transform:translateY(-1px)}
    .icon{
      width:72px;height:72px;border-radius:20px;
      display:grid;place-items:center;margin-bottom:15px;
      background:#f1f5ff;color:#3d64c8;
    }
    .icon svg{width:38px;height:38px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .subject h2{font-size:20px;margin-bottom:5px}
    .subject p{font-size:12px;color:#7b879b}
    .footer{margin-top:25px;font-size:12px;color:#8a94a6}
    @media(max-width:720px){
      body{padding:20px 14px}
      .subjects{grid-template-columns:repeat(2,1fr);gap:13px}
      .subject{min-height:155px;padding:20px 12px}
      .icon{width:62px;height:62px;border-radius:17px;margin-bottom:12px}
      .icon svg{width:32px;height:32px}
      .subject h2{font-size:17px}
    }
    @media(max-width:390px){
      .subjects{gap:10px}
      .subject{min-height:145px}
      .subject h2{font-size:16px}
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="badge">🎓 Grade 12 Examination</div>
    <h1>Choose a Subject</h1>
    <p class="subtitle">ဘာသာရပ်တစ်ခုကို ရွေးချယ်ပါ</p>

    <section class="subjects" aria-label="Grade 12 subjects">
      <button class="subject" type="button" data-subject="Myanmar">
        <span class="icon">
          <svg viewBox="0 0 24 24"><path d="M4 5h16v14H4z"/><path d="M7 9h10M7 13h7M7 17h5"/></svg>
        </span>
        <h2>Myanmar</h2><p>မြန်မာစာ</p>
      </button>

      <button class="subject" type="button" data-subject="English">
        <span class="icon">
          <svg viewBox="0 0 24 24"><path d="M5 4h14v16H5z"/><path d="M8 8h8M8 12h6M8 16h8"/></svg>
        </span>
        <h2>English</h2><p>အင်္ဂလိပ်စာ</p>
      </button>

      <button class="subject" type="button" data-subject="Mathematics">
        <span class="icon">
          <svg viewBox="0 0 24 24"><path d="M5 5h14v14H5z"/><path d="M8 9h8M12 7v4M8 15h3M15 13l-4 4M15 17l-4-4"/></svg>
        </span>
        <h2>Maths</h2><p>သင်္ချာ</p>
      </button>

      <button class="subject" type="button" data-subject="Chemistry">
        <span class="icon">
          <svg viewBox="0 0 24 24"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.8 3h10.4A2 2 0 0 0 19 18l-5-9V3"/><path d="M8 15h8"/></svg>
        </span>
        <h2>Chemistry</h2><p>ဓာတုဗေဒ</p>
      </button>

      <button class="subject" type="button" data-subject="Physics">
        <span class="icon">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.5"/><path d="M12 4c2.5 0 4 3.6 4 8s-1.5 8-4 8-4-3.6-4-8 1.5-8 4-8z"/><path d="M5.1 8c1.25-2.15 5-1.55 7.8.05 2.8 1.6 4.85 4.35 3.6 6.5-1.25 2.15-5 1.55-7.8-.05C5.9 12.9 3.85 10.15 5.1 8z"/><path d="M5.1 16c-1.25-2.15.8-4.9 3.6-6.5 2.8-1.6 6.55-2.2 7.8-.05 1.25 2.15-.8 4.9-3.6 6.5-2.8 1.6-6.55 2.2-7.8.05z"/></svg>
        </span>
        <h2>Physics</h2><p>ရူပဗေဒ</p>
      </button>

      <button class="subject" type="button" data-subject="Biology">
        <span class="icon">
          <svg viewBox="0 0 24 24"><path d="M12 20c-3.8-2.2-6-5.4-6-9.2C6 6.5 8.7 4 12 4s6 2.5 6 6.8c0 3.8-2.2 7-6 9.2z"/><path d="M12 4c0 5.5-2.5 9.3-7 11M12 8c2.5 0 4.5 1 6 3"/></svg>
        </span>
        <h2>Biology</h2><p>ဇီဝဗေဒ</p>
      </button>
    </section>

    <p class="footer">Select a subject to continue</p>
  </main>

  <script>
    document.querySelectorAll(".subject").forEach(button => {
      button.addEventListener("click", () => {
        document.querySelectorAll(".subject").forEach(item => item.classList.remove("selected"));
        button.classList.add("selected");
        window.dispatchEvent(new CustomEvent("subjectSelected", {
          detail: { subject: button.dataset.subject }
        }));
      });
    });
  </script>
</body>
</html>
