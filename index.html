<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Grade 12 Exam Paper Generator</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Myanmar","Myanmar Text",sans-serif;background:#eef2f7;color:#172033}
button,input,textarea{font:inherit}.hidden{display:none!important}
.home{min-height:100vh;padding:32px 18px;display:flex;justify-content:center;align-items:center}.home-inner{width:min(1000px,100%);text-align:center}
.badge{display:inline-block;background:#fff;border:1px solid #e1e6ef;padding:8px 14px;border-radius:999px;font-size:13px;color:#59677d;margin-bottom:14px}
h1{font-size:clamp(28px,5vw,46px);margin:0 0 8px}.sub{color:#68758a;margin:0 0 28px}
.subjects{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.subject{border:1px solid #e1e6ef;background:#fff;border-radius:22px;min-height:175px;padding:22px;cursor:pointer;box-shadow:0 10px 30px #17203312;transition:.2s}.subject:hover{transform:translateY(-5px);box-shadow:0 16px 38px #1720331c}.icon{width:68px;height:68px;margin:0 auto 14px;border-radius:18px;background:#f0f4ff;display:grid;place-items:center;color:#3c61c7}.icon svg{width:37px;height:37px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.subject h2{margin:0 0 4px;font-size:19px}.subject p{margin:0;color:#7a879a;font-size:12px}

.app{min-height:100vh}.toolbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #dfe5ee;padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.toolbar h2{margin:0 10px 0 0;font-size:18px}.btn{border:0;border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:700}.back{background:#edf1f7}.primary{background:#315bc7;color:#fff}.green{background:#197a4b;color:#fff}.dark{background:#202938;color:#fff}
.editor{max-width:1100px;margin:18px auto;padding:0 14px}.settings{background:#fff;border:1px solid #dfe5ee;border-radius:14px;padding:14px;margin-bottom:18px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.field label{display:block;font-size:12px;color:#68758a;margin-bottom:5px}.field input{width:100%;padding:10px;border:1px solid #ccd5e3;border-radius:8px}
.paper-list{display:flex;flex-direction:column;gap:22px;align-items:center}.paper{width:210mm;height:297mm;min-width:210mm;min-height:297mm;max-width:210mm;max-height:297mm;background:#fff;padding:14mm 15mm;overflow:hidden;box-shadow:0 4px 20px #1720331a;position:relative;color:#111;box-sizing:border-box;contain:layout paint}.paper-head{text-align:center;padding-bottom:7px;margin-bottom:9px;position:relative}.paper-head .year{font-size:18px;font-weight:900}.paper-head .school{font-size:18px;font-weight:800}.paper-head .exam{font-size:20px;font-weight:900;margin:3px 0}.paper-head .subject-name{font-size:17px;font-weight:800;margin-top:3px}.paper-head .time-allowed{font-size:14px;font-weight:800;margin-top:5px}.paper-head .department{font-size:15px;font-weight:800;margin:2px 0}.instructions{margin:8px 0 12px;font-size:13px}.questions{outline:none;white-space:pre-wrap;line-height:1.5;font-size:13px;overflow:hidden;word-break:normal;overflow-wrap:break-word}.page-num{position:absolute;bottom:7mm;left:0;right:0;text-align:center;font-size:11px;color:#555}.pto{position:absolute;right:10mm;bottom:7mm;font-size:13px;font-weight:800;white-space:nowrap}
.section{margin:0 0 7px;break-inside:avoid;page-break-inside:avoid;overflow:hidden}.section-title{font-weight:900;font-size:13px;margin-bottom:4px;line-height:1.3}.section-marks{font-weight:700;font-size:12px;margin-left:6px}.section-help{font-size:12px;color:#333;margin-bottom:3px}
.english-paper .questions{min-height:0;overflow:hidden}.english-paper .paper-head{margin-bottom:3px;padding-bottom:3px}.english-paper .instructions{margin-bottom:6px}
.note{font-size:12px;color:#657188;text-align:center;margin:12px 0 25px}
@media(max-width:900px){.subjects{grid-template-columns:repeat(2,1fr)}.paper{transform-origin:top center;zoom:.72}.paper-list{overflow-x:auto;align-items:flex-start}.settings{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.subjects{gap:10px}.subject{min-height:145px;padding:17px}.icon{width:58px;height:58px}.settings{grid-template-columns:1fr}.toolbar h2{width:100%}.paper{zoom:.48}}
@media print{body{background:#fff}.toolbar,.settings,.note{display:none!important}.editor{margin:0;padding:0}.paper-list{gap:0}.paper{box-shadow:none;margin:0;break-after:page;page-break-after:always}.paper:last-child{break-after:auto}}
</style>
</head>
<body>
<section id="home" class="home">
<div class="home-inner">
<div class="badge">🎓 Grade 12 Examination</div>
<h1>Choose a Subject</h1><p class="sub">ဘာသာရပ်ရွေးပြီး Exam Paper ဖန်တီးပါ</p>
<div class="subjects">
<button class="subject" data-subject="Myanmar" data-mm="မြန်မာစာ"><div class="icon"><svg viewBox="0 0 24 24"><path d="M4 5h16v14H4z"/><path d="M7 9h10M7 13h7M7 17h5"/></svg></div><h2>Myanmar</h2><p>မြန်မာစာ</p></button>
<button class="subject" data-subject="English" data-mm="အင်္ဂလိပ်စာ"><div class="icon"><svg viewBox="0 0 24 24"><path d="M5 4h14v16H5z"/><path d="M8 8h8M8 12h6M8 16h8"/></svg></div><h2>English</h2><p>အင်္ဂလိပ်စာ</p></button>
<button class="subject" data-subject="Mathematics" data-mm="သင်္ချာ"><div class="icon"><svg viewBox="0 0 24 24"><path d="M5 5h14v14H5z"/><path d="M8 9h8M12 7v4M8 15h3M15 13l-4 4M15 17l-4-4"/></svg></div><h2>Mathematics</h2><p>သင်္ချာ</p></button>
<button class="subject" data-subject="Chemistry" data-mm="ဓာတုဗေဒ"><div class="icon"><svg viewBox="0 0 24 24"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.8 3h10.4A2 2 0 0 0 19 18l-5-9V3"/><path d="M8 15h8"/></svg></div><h2>Chemistry</h2><p>ဓာတုဗေဒ</p></button>
<button class="subject" data-subject="Physics" data-mm="ရူပဗေဒ"><div class="icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.5"/><ellipse cx="12" cy="12" rx="4" ry="8"/><ellipse cx="12" cy="12" rx="4" ry="8" transform="rotate(60 12 12)"/><ellipse cx="12" cy="12" rx="4" ry="8" transform="rotate(-60 12 12)"/></svg></div><h2>Physics</h2><p>ရူပဗေဒ</p></button>
<button class="subject" data-subject="Biology" data-mm="ဇီဝဗေဒ"><div class="icon"><svg viewBox="0 0 24 24"><path d="M12 20c-3.8-2.2-6-5.4-6-9.2C6 6.5 8.7 4 12 4s6 2.5 6 6.8c0 3.8-2.2 7-6 9.2z"/><path d="M12 4c0 5.5-2.5 9.3-7 11M12 8c2.5 0 4.5 1 6 3"/></svg></div><h2>Biology</h2><p>ဇီဝဗေဒ</p></button>
</div>
</div>
</section>

<section id="app" class="app hidden">
<div class="toolbar">
<button class="btn back" id="back">← Subjects</button><h2 id="selectedTitle">Exam Paper</h2>
<button class="btn primary" id="pdf">📄 Export PDF</button><button class="btn green" id="png">🖼 Export PNGs</button><button class="btn dark" id="print">🖨 Print</button>
</div>
<div class="editor">
<div class="settings">
<div class="field"><label>School / Center</label><input id="school" value="School / Education Center"></div>
<div class="field"><label>Exam Title</label><input id="exam" value="2027 MATRICULATION EXAMINATIONS"></div>
<div class="field"><label>Date</label><input id="date" placeholder="DD / MM / YYYY"></div>
<div class="field"><label>Duration</label><input id="duration" value="1 Hour"></div>
<div class="field"><label>Total Marks</label><input id="marks" value="50 Marks"></div>
<div class="field"><label>Instructions</label><input id="instructions" value="WRITE YOUR ANSWERS IN THE ANSWER BOOKLET. ANSWER ALL QUESTIONS."></div>
</div>
<p class="note">အောက်က စာမျက်နှာတွေမှာ မေးခွန်းတွေကို နောက်မှ တိုက်ရိုက်ထည့်နိုင်ပါတယ်။</p>
<div id="papers" class="paper-list"></div>
</div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const home=document.getElementById("home"),app=document.getElementById("app"),papers=document.getElementById("papers");
let subject="",subjectMM="";
const genericDefaults=[
"၁။ ____________________________________________________________\n\n၂။ ____________________________________________________________\n\n၃။ ____________________________________________________________",
"၄။ ____________________________________________________________\n\n၅။ ____________________________________________________________\n\n၆။ ____________________________________________________________",
"၇။ ____________________________________________________________\n\n၈။ ____________________________________________________________\n\n၉။ ____________________________________________________________",
"၁၀။ ___________________________________________________________\n\n၁၁။ ___________________________________________________________\n\n၁၂။ ___________________________________________________________"
];

function val(id){return document.getElementById(id).value}


function subjectTemplate(key){
const B=(title,marks,body)=>[title,marks,body];
const line="______________________________________________________________";
const many=(n)=>Array.from({length:n},(_,i)=>"("+(i+1)+") "+line).join("\n\n");
const science={
Chemistry:[
 [B("SECTION (A) — Answer ALL questions.","36 marks","1. TRUE / FALSE — 10 items (1 mark each)\n\n"+many(10)),
  B("2. Fill in the blanks with the correct word(s), notation(s), term(s), unit(s), etc.","10 marks",many(10)),
  B("3. Choose the best answer for each question.","10 marks",many(10)),
  B("4. Definitions / explanations / statements.","8 marks",many(8))],
 [B("SECTION (B) — Answer ALL questions.","64 marks","6. Short questions — 6 questions × 2 marks = 12 marks\n\n"+many(6)),
  B("7. Medium questions — answer any FIVE.","20 marks","8 questions × 4 marks; answer any 5.\n\n"+many(8)),
  B("8. Long questions — answer any FOUR.","32 marks","6 questions × 8 marks; answer any 4.\n\n"+many(6))]
],
Physics:[
 [B("SECTION (A) — Answer ALL questions.","40 marks","1. TRUE / FALSE — 10 items (1 mark each)\n\n"+many(10)),
  B("2. Fill in the blanks.","15 marks",many(15)),
  B("3. Multiple Choice Questions — choose the correct answer.","15 marks",many(15))],
 [B("SECTION (B) — Answer any FOUR questions.","60 marks","6 long/structured questions × 15 marks; answer any 4.\n\n"+many(6))]
],
Biology:[
 [B("SECTION (A) — Answer ALL questions. No choice.","30 marks","1. TRUE / FALSE — 10 items × 1 mark\n\n"+many(10)),
  B("2. Completion — one correct word.","10 marks",many(10)),
  B("3. Multiple Choice — choose A, B, C or D.","10 marks",many(10))],
 [B("SECTION (B) — Question 4: Answer ALL.","30 marks","4. Short questions — 6 questions × 5 marks.\n\n"+many(6)),
  B("Question 5: Answer any FOUR.","40 marks","6 long questions × 10 marks; answer any 4.\n\n"+many(6))]
],
Mathematics:[
 [B("SECTION A — Objective.","10 marks","Questions 1–10. Each carries 1 mark. Choose the correct / most appropriate answer.\n\n"+many(10)),
  B("SECTION B — Answer only the solution.","20 marks","Questions 11–20. Each carries 2 marks. No working is required.\n\n"+many(10))],
 [B("SECTION C — Show systematic working.","30 marks","Questions 21–30. Each carries 3 marks.\n\n"+many(10))],
 [B("SECTION D — Show systematic working.","40 marks","Questions 31–38. Each carries 5 marks.\n\n"+many(8))]
],
Myanmar:[
 [B("၁။ ဓမ္မဓိဋ္ဌာန် မေးခွန်းကြီး","30 မှတ်","(က) မှား / မှန် — ၁၀ မှတ်\n\n"+many(10)+"\n\n(ခ) ကွက်လပ်ဖြည့် — ၁၀ မှတ်\n\n"+many(10)+"\n\n(ဂ) ရွေးချယ်စရာ ၃ ခုမှ အဖြေမှန်ရွေး — ၁၀ မှတ်\n\n"+many(10))],
 [B("၂။ မေးခွန်းတိုများ","20 မှတ်","(က) ခက်ဆစ် — စကားလုံး ၇ ခုမှ ၅ ခု ဖြေ (၅ မှတ်)\n\n(ခ) အလင်္ကာ — ၇ ခုမှ ၅ ခု ဖြေ (၅ မှတ်)\n\n(ဂ) ရေသည်ပြဇာတ် စကားစပ် — ၅ မှတ်\n\n(ဃ) အပြောသင်ခန်းစာ မေးခွန်းတို — ၅ မှတ်\n\n"+many(4))],
 [B("၃။ ကဗျာ မေးခွန်းရှည်","10 မှတ်","အဖတ်အရွတ်သင်ခန်းစာရှိ ကဗျာများမှ မေးမြန်းခြင်း။ လေ့လာမှတ်သားမှု + ကိုယ်ပိုင်အရေးအသား/တင်ပြမှုကို အကဲဖြတ်ရန်။\n\n"+line)],
 [B("၄။ စကားပြေ မေးခွန်းရှည်","10 မှတ်","အဖတ်အရွတ်သင်ခန်းစာရှိ စကားပြေများမှ မေးမြန်းခြင်း။ မေးခွန်း၏ ရှုထောင့်နှင့်ကိုက်ညီစွာ ဖြေဆိုရန်။\n\n"+line)],
 [B("၅။ ရေသည်ပြဇာတ် မေးခွန်းရှည်","10 မှတ်","ရေသည်ပြဇာတ်မှ အကြောင်းအရာ သို့မဟုတ် အရေးအသားဆိုင်ရာ မေးခွန်း။\n\n"+line),
  B("၆။ စာစီစာကုံး","10 မှတ်","ခေါင်းစဉ် ၂ ခုမှ ၁ ခုရွေး။ ပုံကြမ်းအချက် ၅ ချက်ကို အခြေခံရေးသားရန်။\n\n"+many(5))],
 [B("၇။ အဆိုဆွေးနွေးချက်","10 မှတ်","အဆို ၂ ခုအနက် ၁ ခုကို ထောက်ခံ၍ဖြစ်စေ၊ ကန့်ကွက်၍ဖြစ်စေ ဆွေးနွေးရန်။\n\nနိဒါန်း — စာကိုယ် — စာကိုယ် — နိဂုံး\n\n"+many(4))]
],
English:[
 [B("I. Complete the sentences with the appropriate words. The initial letters are given.","10 marks",many(10)),
  B("II. Choose the appropriate words or phrases to complete the sentences.","10 marks",many(10)),
  B("III. (A) Rewrite the sentences according to the instructions given in brackets.","5 marks",many(5)),
  B("III. (B) Complete the lines of poetry with appropriate words.","5 marks",many(5))],
 [B("IV. Give complete answers to these questions.","10 marks",many(10)),
  B("V. Read the passage. Answer these questions. Give complete answers.","10 marks","UNSEEN PASSAGE\n\n(A) Vocabulary / meaning — 5 marks\n"+many(5)+"\n(B) Comprehension — 5 marks\n"+many(5))],
 [B("VI. Punctuate the following.","5 marks",many(5)),
  B("VII. (A) Finish each sentence so that it means exactly the same as the sentence given.","10 marks",many(10))],
 [B("VII. (B) Using the prompts given, write a very short paragraph on ONE of the following.","10 marks","Option 1\n"+line+"\n\nOption 2\n"+line),
  B("VIII. Letter Writing — choose ONE situation.","10 marks","Write a letter. Do not write more than 300 words.\n\nOption 1: "+line+"\n\nOR\n\nOption 2: "+line)],
 [B("IX. Essay Writing — choose ONE topic.","15 marks","Write an essay on ONE of the given topics. Do not write more than 500 words.\n\n(1) "+line+"\n\n(2) "+line+"\n\n(3) "+line)]
]
};
return science[key]||[];
}

function makeSection(sec){
const [title,marks,body]=sec;
return '<div class="section"><div class="section-title">'+title+' <span class="section-marks">('+marks+')</span></div><div class="section-body" contenteditable="true">'+body+'</div></div>';
}

function renderSubject(){
papers.innerHTML="";
const pages=subjectTemplate(subject);
if(!pages.length){return;}
const total=pages.length;
pages.forEach((sections,i)=>{
const p=document.createElement("article");
p.className="paper";
p.id="paper"+(i+1);
const header=i===0?'<div class="paper-head"><div class="year">2027</div><div class="exam"></div><div class="department">DEPARTMENT OF MYANMAR EXAMINATIONS</div><div class="subject-name"></div><div class="time-allowed"></div></div><div class="instructions"></div>':"";
p.innerHTML=header+'<div class="questions">'+sections.map(makeSection).join("")+'</div><div class="pto">P.T.O&gt;</div><div class="page-num">Page '+(i+1)+' / '+total+'</div>';
papers.appendChild(p);
});
sync();
}

function render(){renderSubject();}
document.querySelectorAll(".subject").forEach(b=>b.onclick=()=>{
subject=b.dataset.subject;subjectMM=b.dataset.mm;
document.getElementById("selectedTitle").textContent=subject+" / "+subjectMM;
home.classList.add("hidden");app.classList.remove("hidden");render();
});
document.querySelectorAll(".settings input").forEach(x=>x.addEventListener("input",()=>sync()));
document.getElementById("back").onclick=()=>{app.classList.add("hidden");home.classList.remove("hidden")};
document.getElementById("print").onclick=()=>window.print();
async function capturePaper(index){
const source=document.getElementById("paper"+index);
if(!source) throw new Error("Paper "+index+" not found");
const clone=source.cloneNode(true);
clone.style.setProperty("zoom","1","important");
clone.style.setProperty("transform","none","important");
clone.style.setProperty("width","794px","important");
clone.style.setProperty("height","1123px","important");
clone.style.setProperty("min-width","794px","important");
clone.style.setProperty("min-height","1123px","important");
clone.style.setProperty("max-width","794px","important");
clone.style.setProperty("max-height","1123px","important");
clone.style.setProperty("padding","53px 57px","important");
clone.style.setProperty("box-sizing","border-box","important");
clone.style.setProperty("margin","0","important");
clone.style.setProperty("box-shadow","none","important");
clone.style.setProperty("position","fixed","important");
clone.style.setProperty("left","-10000px","important");
clone.style.setProperty("top","0","important");
clone.style.setProperty("overflow","hidden","important");
clone.style.setProperty("background","#fff","important");
document.body.appendChild(clone);
await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
const canvas=await html2canvas(clone,{
scale:2,
backgroundColor:"#fff",
useCORS:true,
logging:false,
width:794,
height:1123,
windowWidth:794,
windowHeight:1123,
scrollX:0,
scrollY:0
});
clone.remove();
return canvas;
}
document.getElementById("pdf").onclick=async()=>{
const {jsPDF}=window.jspdf;const pdf=new jsPDF("p","mm","a4");
for(let i=1;i<=papers.querySelectorAll(".paper").length;i++){
if(i>1)pdf.addPage();
const c=await capturePaper(i);
pdf.addImage(c.toDataURL("image/jpeg",.95),"JPEG",0,0,210,297);
}
pdf.save((subject||"Exam")+"-Exam-Paper.pdf");
};
document.getElementById("png").onclick=async()=>{
for(let i=1;i<=papers.querySelectorAll(".paper").length;i++){
const c=await capturePaper(i);
const a=document.createElement("a");
a.href=c.toDataURL("image/png");
a.download=(subject||"Exam")+"-Page-"+i+".png";
a.click();
await new Promise(r=>setTimeout(r,250));
}
};
</script>
</body>
</html>
