<style>

button,input,textarea{font:inherit}.hidden{display:none!important}
.home{min-height:100vh;padding:32px 18px;display:flex;justify-content:center;align-items:center}.home-inner{width:min(1000px,100%);text-align:center}
.badge{display:inline-block;background:#fff;border:1px solid #e1e6ef;padding:8px 14px;border-radius:999px;font-size:13px;color:#59677d;margin-bottom:14px}
h1{font-size:clamp(28px,5vw,46px);margin:0 0 8px}.sub{color:#68758a;margin:0 0 28px}
.subjects{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.subject{border:1px solid #e1e6ef;background:#fff;border-radius:22px;min-height:175px;padding:22px;cursor:pointer;box-shadow:0 10px 30px #17203312;transition:.2s}.subject:hover{transform:translateY(-5px);box-shadow:0 16px 38px #1720331c}.icon{width:68px;height:68px;margin:0 auto 14px;border-radius:18px;background:#f0f4ff;display:grid;place-items:center;color:#3c61c7}.icon svg{width:37px;height:37px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.subject h2{margin:0 0 4px;font-size:19px}.subject p{margin:0;color:#7a879a;font-size:12px}

.app{min-height:100vh}.toolbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #dfe5ee;padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.toolbar h2{margin:0 10px 0 0;font-size:18px}.btn{border:0;border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:700}.back{background:#edf1f7}.primary{background:#315bc7;color:#fff}.green{background:#197a4b;color:#fff}.dark{background:#202938;color:#fff}
.editor{max-width:1100px;margin:18px auto;padding:0 14px}.settings{background:#fff;border:1px solid #dfe5ee;border-radius:14px;padding:14px;margin-bottom:18px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.field label{display:block;font-size:12px;color:#68758a;margin-bottom:5px}.field input{width:100%;padding:10px;border:1px solid #ccd5e3;border-radius:8px}
.paper-list{display:flex;flex-direction:column;gap:22px;align-items:center}.paper{width:210mm;height:297mm;min-width:210mm;min-height:297mm;max-width:210mm;max-height:297mm;background:#fff;padding:14mm 15mm;overflow:hidden;box-shadow:0 4px 20px #1720331a;position:relative;color:#111;box-sizing:border-box;contain:layout paint}.paper-head{text-align:center;padding-bottom:7px;margin-bottom:9px;position:relative}.paper-head .year{font-size:18px;font-weight:900}.paper-head .school{font-size:18px;font-weight:800}.paper-head .exam{font-size:20px;font-weight:900;margin:3px 0}.paper-head .subject-name{font-size:17px;font-weight:800;margin-top:3px}.paper-head .time-allowed{font-size:14px;font-weight:800;margin-top:5px}.paper-head .department{font-size:14px;font-weight:800;margin:2px 0}.myanmar-head{font-weight:900}.myanmar-head .year,.myanmar-head .exam,.myanmar-head .department{font-weight:900}.myanmar-meta{display:flex;justify-content:space-between;align-items:flex-start;font-size:15px;font-weight:900;margin-top:10px}.myanmar-instruction{font-size:14px;font-weight:900;margin-top:5px;white-space:nowrap}.section-body{white-space:pre-wrap;line-height:1.42;font-size:12.5px;font-weight:400;font-family:system-ui,-apple-system,"Noto Sans Myanmar","Myanmar Text",sans-serif}.section-body[contenteditable="plaintext-only"]{outline:none}.instructions{margin:8px 0 12px;font-size:13px}.questions{outline:none;white-space:pre-wrap;line-height:1.5;font-size:13px;overflow:hidden;word-break:normal;overflow-wrap:break-word}.page-num{position:absolute;bottom:7mm;left:0;right:0;text-align:center;font-size:11px;color:#555}.pto{position:absolute;right:10mm;bottom:7mm;font-size:13px;font-weight:800;white-space:nowrap}
.section{margin:0 0 7px;break-inside:avoid;page-break-inside:avoid;overflow:hidden}.section-title{font-weight:900;font-size:13px;margin-bottom:4px;line-height:1.3}.section-marks{font-weight:700;font-size:12px;margin-left:6px}.section-help{font-size:12px;color:#333;margin-bottom:3px}.myanmar-paper .questions{font-size:15px;line-height:1.55}.myanmar-paper .section-body{font-size:15px;line-height:1.55;font-weight:400}.myanmar-paper .section-title{font-size:15px}.myanmar-paper .paper-head{font-size:15px}
.english-paper .questions{min-height:0;overflow:hidden}.english-paper .paper-head{margin-bottom:3px;padding-bottom:3px}.english-paper .instructions{margin-bottom:6px}
.physics-paper .physics-head{position:relative;text-align:center;padding-bottom:10px;margin-bottom:12px;font-family:Arial,Helvetica,sans-serif}
.physics-paper .ph-time{position:absolute;right:0;top:0;font-size:10pt;font-weight:400}
.physics-paper .ph-line1{font-size:14pt;font-weight:700}
.physics-paper .ph-line2{font-size:12pt;font-weight:700;margin-top:2px}
.physics-paper .ph-line3{font-size:16pt;font-weight:700;margin-top:2px}
.physics-paper .ph-line4{font-size:11pt;font-weight:700;margin-top:5px}
.physics-paper .ph-line5{font-size:10pt;font-weight:400;margin-top:4px}
.physics-paper .physics-section{text-align:center;font-size:13pt;font-weight:700;margin:10px 0 2px}
.physics-paper .physics-sub{text-align:center;font-size:11pt;font-style:italic;font-weight:400;margin:0 0 9px}
.physics-paper .section-title{font-size:12.5pt;font-weight:700;text-align:left}
.physics-paper .section-marks{float:right;font-size:10.5pt;font-weight:400}
.physics-paper .section-body{font-family:Arial,Helvetica,sans-serif;font-size:11pt;font-weight:400;line-height:1.45;text-align:left}

<script>

let subject="",subjectMM="";
const genericDefaults=[

"၄။ ____________________________________________________________\n\n၅။ ____________________________________________________________\n\n၆။ ____________________________________________________________",

 [B("","","၃။ ________________________________________________________\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n၄။ ________________________________________________________\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n၅။ ________________________________________________________\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n၆။ နှစ်သက်ရာ တစ်ခု စာစီကုံးပါ။\n\n____________________________________________________________\n____________________________________________________________\n____________________________________________________________\n____________________________________________________________\n____________________________________________________________\n____________________________________________________________\n\n၇။ အောက်ပါတို့အနက် တစ်ခုကို ထောက်ခံ၍ ဖြစ်စေ၊ ကန့်ကွက်၍ ဖြစ်စေ ဆွေးနွေးပါ။\n\n၁။ ________________________________________________________\n၂။ ________________________________________________________")]
],
English:[

  B("II. Choose the appropriate words or phrases to complete the sentences.","10 marks",q(10))],

  B("IV. Complete the lines of poetry with appropriate words.","5 marks",q(5))],

function makeSection(sec){
const [title,marks,body]=sec;
return '<div class="section"><div class="section-title">'+title+(marks ? ' <span class="section-marks">('+marks+')</span>' : '')+'</div><div class="section-body" contenteditable="plaintext-only">'+body+'</div></div>';
}

function renderSubject(){
papers.innerHTML="";
const pages=subjectTemplate(subject);
if(!pages.length){return;}
const total=pages.length;
pages.forEach((sections,i)=>{
const p=document.createElement("article");
p.className="paper"+(subject==="Myanmar"?" myanmar-paper":subject==="Physics"?" physics-paper":"");
p.id="paper"+(i+1);
const header=i===0?(subject==="Myanmar"?'<div class="paper-head myanmar-head"><div class="year">၂၀၂၇ ခုနှစ်</div><div class="exam">တက္ကသိုလ်ဝင်စာမေးပွဲ</div><div class="department">မြန်မာနိုင်ငံစာစစ်ဦးစီးဌာန</div><div class="myanmar-meta"><span>မြန်မာစာ<div class="myanmar-instruction">မေးခွန်းအားလုံး ဖြေဆိုပါ။</div></span><span>ခွင့်ပြုချိန် ၃ နာရီ</span></div></div>':(subject==="Physics"?'<div class="physics-head"><div class="ph-time">Time Allowed: 3 Hours | Page 1</div><div class="ph-line1">2027 / MATRICULATION EXAMINATION</div><div class="ph-line2">DEPARTMENT OF MYANMAR EXAMINATIONS</div><div class="ph-line3">PHYSICS</div><div class="ph-line4">WRITE YOUR ANSWERS IN THE ANSWER BOOKLET</div><div class="ph-line5">The symbols in this paper have their usual significance</div></div>':'<div class="paper-head myanmar-head"><div class="year">2027</div><div class="exam">MATRICULATION EXAMINATIONS</div><div class="department">DEPARTMENT OF MYANMAR EXAMINATIONS</div><div class="myanmar-meta"><span>'+subject.toUpperCase()+'</span><span>TIME ALLOWED : 3 HOUR</span></div></div><div class="instructions">WRITE YOUR ANSWERS IN THE ANSWER BOOKLET.</div><div class="instructions">ANSWER ALL QUESTIONS.</div>')):"";
if(subject==="Physics"){const content=i===0?'<div class="physics-section">SECTION (A)</div><div class="physics-sub">(Answer ALL questions)</div>':'<div class="physics-section">SECTION (B)</div><div class="physics-sub">(Answer any FOUR questions)</div>';p.innerHTML=header+'<div class="questions">'+content+sections.map(makeSection).join("")+'</div>';}else{p.innerHTML=header+'<div class="questions">'+sections.map(makeSection).join("")+'</div>';}
papers.appendChild(p);
});
sync();
}

function render(){renderSubject();}
document.querySelectorAll(".subject").forEach(b=>b.onclick=()=>{
subject=b.dataset.subject;subjectMM=b.dataset.mm;
document.getElementById("selectedTitle").textContent=subject+" / "+subjectMM;
home.classList.add("hidden");app.classList.remove("hidden");render();
});
document.querySelectorAll(".settings input").forEach(x=>x.addEventListener("input",()=>sync()));
document.getElementById("back").onclick=()=>{app.classList.add("hidden");home.classList.remove("hidden")};

async function capturePaper(index){
const source=document.getElementById("paper"+index);
if(!source) throw new Error("Paper "+index+" not found");
const clone=source.cloneNode(true);
clone.style.setProperty("zoom","1","important");
clone.style.setProperty("transform","none","important");
clone.style.setProperty("width","794px","important");
clone.style.setProperty("height","1123px","important");

clone.style.setProperty("min-height","1123px","important");

document.getElementById("pdf").onclick=async()=>{
const {jsPDF}=window.jspdf;const pdf=new jsPDF("p","mm","a4");
for(let i=1;i<=papers.querySelectorAll(".paper").length;i++){
if(i>1)pdf.addPage();
const c=await capturePaper(i);
pdf.addImage(c.toDataURL("image/jpeg",.95),"JPEG",0,0,210,297);
}
pdf.save((subject||"Exam")+"-Exam-Paper.pdf");
};
document.getElementById("png").onclick=async()=>{
const button=document.getElementById("png"), originalLabel=button.textContent;
button.disabled=true; button.textContent="Preparing all pages…";
try{
 const zip=new JSZip(), pageCount=papers.querySelectorAll(".paper").length;
 for(let i=1;i<=pageCount;i++){
  button.textContent="Preparing page "+i+" / "+pageCount+"…";
  const canvas=await capturePaper(i);
  const blob=await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(new Error("PNG creation failed")),"image/png"));
  zip.file((subject||"Exam")+"-Page-"+String(i).padStart(2,"0")+".png",blob);
 }
 button.textContent="Creating ZIP…";
 const archive=await zip.generateAsync({type:"blob",compression:"DEFLATE",compressionOptions:{level:4}});
 const url=URL.createObjectURL(archive), a=document.createElement("a");
 a.href=url; a.download=(subject||"Exam")+"-All-Pages-PNG.zip";
 document.body.appendChild(a); a.click(); a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),2000);
}catch(error){console.error(error);alert("PNG ထုတ်ရာတွင် အမှားဖြစ်နေပါသည်။ အင်တာနက်ချိတ်ဆက်မှုကို စစ်ဆေးပြီး ထပ်မံကြိုးစားပါ။");}
finally{button.disabled=false;button.textContent=originalLabel;}
};
</script>
