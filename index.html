// Blank exam pages use normal text editing; no free-positioned text blocks.
// Keep Enter inside a dialogue box; never create a new dialogue box automatically.
// Prevent the browser from splitting a dialogue-box into a second box on Enter.
papers.addEventListener("keydown",event=>{
  const box=event.target.closest(".dialogue-box");
  if(!box || event.key!=="Enter") return;
  event.preventDefault();
  const selection=window.getSelection();
  if(!selection || selection.rangeCount===0) return;
  const range=selection.getRangeAt(0);
  if(!box.contains(range.startContainer) && range.startContainer!==box) return;
  range.deleteContents();
  const br=document.createElement("br");
  range.insertNode(br);
  range.setStartAfter(br);
  range.collapse(true);
  selection.removeAllRanges();
  selection.addRange(range);
});
// Rich-text tools apply to selected editable question text and are included in PDF/PNG exports.
document.querySelectorAll(".format-btn").forEach(button=>{
  button.addEventListener("mousedown",event=>event.preventDefault());
  button.addEventListener("click",()=>{
    const command=button.dataset.command;
    if(command==="box"){wrapSelectionInBox();return;}
    if(command==="dialogue"){insertDialogueBox();return;}
    const selection=window.getSelection();
    const active=selection && selection.anchorNode ? (selection.anchorNode.nodeType===1?selection.anchorNode:selection.anchorNode.parentElement) : null;
    const editable=active && active.closest('[contenteditable="true"]');
    if(!editable || !papers.contains(editable)){
      alert("အရင်ဆုံး ပြင်ချင်တဲ့ မေးခွန်းစာသားကို select လုပ်ပါ။");
      return;
    }
    document.execCommand(command,false,null);
  });
});
function insertDialogueBox(){
  const selection=window.getSelection();
  const activeNode=selection && selection.anchorNode ? (selection.anchorNode.nodeType===1?selection.anchorNode:selection.anchorNode.parentElement) : null;
  const editable=activeNode && activeNode.closest('[contenteditable="true"]');
  if(!editable || !papers.contains(editable)){
    alert("Dialogue Box ထည့်ချင်တဲ့ အဖြေစာသားနေရာကို အရင်နှိပ်ပါ။");
    return;
  }
  const box=document.createElement("div");
  box.className="dialogue-box";
  box.contentEditable="true";
  box.setAttribute("aria-label","Blank dialogue answer box — type the answer here");
  box.textContent="";
  const range=selection.getRangeAt(0);
  range.deleteContents();
  range.insertNode(box);
  const caret=document.createRange();
  caret.selectNodeContents(box);
  caret.collapse(false);
  selection.removeAllRanges();
  selection.addRange(caret);
  box.focus();
}
function wrapSelectionInBox(){
  const selection=window.getSelection();
  if(!selection || selection.rangeCount===0 || selection.isCollapsed){
    alert("Box ထည့်ချင်တဲ့ စာသားကို အရင် select လုပ်ပါ။");
    return;
  }
  const range=selection.getRangeAt(0);
  const root=range.commonAncestorContainer.nodeType===1?range.commonAncestorContainer:range.commonAncestorContainer.parentElement;
  const editable=root && root.closest('[contenteditable="true"]');
  if(!editable || !papers.contains(editable)){
    alert("Box ထည့်မယ့် စာသားကို မေးခွန်းနေရာထဲမှာ select လုပ်ပါ။");
    return;
  }
  const span=document.createElement("span");
  span.className="inline-box";
  try{
    span.appendChild(range.extractContents());
    range.insertNode(span);
    selection.removeAllRanges();
    const nextRange=document.createRange();
    nextRange.selectNodeContents(span);
    selection.addRange(nextRange);
  }catch(error){console.error("Could not add text box",error);}
}

async function capturePaper(index){
const source=document.getElementById("paper"+index);
if(!source) throw new Error("Paper "+index+" not found");
const clone=source.cloneNode(true);
clone.style.setProperty("zoom","1","important");
clone.style.setProperty("transform","none","important");
clone.style.setProperty("width","794px","important");
clone.style.setProperty("height","1123px","important");
clone.style.setProperty("min-width","794px","important");
clone.style.setProperty("min-height","1123px","important");
clone.style.setProperty("max-width","794px","important");
clone.style.setProperty("max-height","1123px","important");
clone.style.setProperty("padding","53px 57px","important");
clone.style.setProperty("box-sizing","border-box","important");
clone.style.setProperty("margin","0","important");
clone.style.setProperty("box-shadow","none","important");
clone.style.setProperty("position","fixed","important");
clone.style.setProperty("left","-10000px","important");
clone.style.setProperty("top","0","important");
clone.style.setProperty("overflow","hidden","important");
clone.style.setProperty("background","#fff","important");
clone.style.setProperty("font-size","13px","important");
clone.querySelectorAll(".section").forEach(x=>x.style.setProperty("break-inside","avoid","important"));
document.body.appendChild(clone);
await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
const canvas=await html2canvas(clone,{
scale:2,
backgroundColor:"#fff",
useCORS:true,
logging:false,
width:794,
height:1123,
windowWidth:794,
windowHeight:1123,
scrollX:0,
scrollY:0
});
clone.remove();
return canvas;
}

document.getElementById("png").onclick=async()=>{
const button=document.getElementById("png"), originalLabel=button.textContent;
button.disabled=true;
try{
 const pageCount=papers.querySelectorAll(".paper").length;
 if(!pageCount) throw new Error("No pages to export");
 if(typeof window.JSZip==="undefined") throw new Error("ZIP library could not load");
 const zip=new window.JSZip();
 for(let i=1;i<=pageCount;i++){
  button.textContent="Preparing page "+i+" / "+pageCount+"…";
  const canvas=await capturePaper(i);
  const blob=await new Promise((resolve,reject)=>{
   if(!canvas.toBlob){reject(new Error("PNG export is unsupported in this browser"));return;}
   canvas.toBlob(b=>b?resolve(b):reject(new Error("PNG creation failed")),"image/png");
  });
  zip.file((subject||"Exam")+"-Page-"+String(i).padStart(2,"0")+".png",blob,{binary:true});
  canvas.width=1;canvas.height=1;
 }
 button.textContent="Packing separate PNG files…";
 const archive=await zip.generateAsync({type:"blob",compression:"STORE"});
 const url=URL.createObjectURL(archive);
 const a=document.createElement("a");
 a.href=url;a.download=(subject||"Exam")+"-Separate-Page-PNGs.zip";
 a.style.position="fixed";a.style.left="-9999px";
 document.body.appendChild(a);
 a.click();
 setTimeout(()=>{a.remove();URL.revokeObjectURL(url);},120000);
}catch(error){
 console.error("PNG export failed:",error);
 alert("PNG မထုတ်နိုင်ပါ။ "+(error&&error.message?error.message:"Browser ပြဿနာရှိနိုင်ပါသည်။")+"\nRefresh လုပ်ပြီး ထပ်စမ်းကြည့်ပါ။");
}finally{
 button.disabled=false;button.textContent=originalLabel;
}
};
