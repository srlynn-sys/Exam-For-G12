function getEnglishPages(){return ["<div class=\"english-content\"><div class=\"english-content\"><h2 class=\"english-section-title\">I. Complete the sentences with the appropriate words. The initial letters are given. <span>(10 marks)</span></h2><p class=\"english-instruction\">Complete each sentence with the correct word. (1 mark each)</p><ol class=\"english-questions\"><li>Children should listen to their parents and other a.......... who have more life experience.</li><li>Our teacher is very g........... She always shares her books and helps students in need.</li><li>You should take a vitamin s.......... if your doctor says your body needs extra vitamins.</li><li>His g.......... made him want to take all the money for himself without sharing it with others.</li><li>Although he is rich, he is very h.......... and never looks down on poor people.</li><li>The soldiers returned home after a g.......... victory in the war.</li><li>A c.......... studies climate change and tries to understand how the Earth's climate is changing.</li><li>Farmers sometimes use p.......... to protect their crops from insects and other pests.</li><li>The s.......... child always gets whatever she wants from her parents and becomes difficult to control.</li><li>The dog became a.......... when a stranger came too close to its puppies.</li></ol><h2 class=\"english-section-title\">II. Choose the appropriate words or phrases to complete the sentences. <span>(10 marks)</span></h2><p class=\"english-instruction\">Choose the correct answer. (1 mark each)</p><ol class=\"english-questions mcq\"><li>Broccoli, cauliflower, and Brussels sprouts are rich in .......... content.<div class=\"english-options\">(A) nutrition &nbsp;&nbsp; (B) nutrient &nbsp;&nbsp; (C) nutritious</div></li><li>The traffic regulations in Myanmar do not teenagers under 18 to drive cars.<div class=\"english-options\">(A) allow &nbsp;&nbsp; (B) let &nbsp;&nbsp; (C) permit</div></li><li>The kitchen was in a .......... state when the maid left without doing the washing-up and cleaning the dining table.<div class=\"english-options\">(A) disgust &nbsp;&nbsp; (B) disgusted &nbsp;&nbsp; (C) disgusting</div></li><li>In 1905, Einstein, whose findings are still used in scientific experiments, .......... that time and space are not independent of each other.<div class=\"english-options\">(A) believed &nbsp;&nbsp; (B) thought &nbsp;&nbsp; (C) proved</div></li><li>We stood on the clifftop and got a spectacular .......... of the landscape all around.<div class=\"english-options\">(A) display &nbsp;&nbsp; (B) view &nbsp;&nbsp; (C) outlook</div></li><li>The teacher encourages the students to ask questions, .......... simple or complex they may be.<div class=\"english-options\">(A) no matter where &nbsp;&nbsp; (B) no matter how &nbsp;&nbsp; (C) no matter what</div></li><li>It is said that music has beneficial effects .......... a number of illnesses.<div class=\"english-options\">(A) for &nbsp;&nbsp; (B) from &nbsp;&nbsp; (C) on</div></li><li>Yupar .......... to the gym twice a week. Thus, being tired does not bother her unlike us.<div class=\"english-options\">(A) used to go &nbsp;&nbsp; (B) is used to going &nbsp;&nbsp; (C) is used to go</div></li><li>.......... difficult economic times, unemployment is getting higher day by day.<div class=\"english-options\">(A) Because &nbsp;&nbsp; (B) As &nbsp;&nbsp; (C) Due to</div></li><li>She has been determined to become a talented musician since she .......... a child.<div class=\"english-options\">(A) is &nbsp;&nbsp; (B) was &nbsp;&nbsp; (C) were</div></li></ol></div</div>","<div class=\"english-content\">><h2 class=\"english-section-title\">III. Rewrite the sentences according to the instructions given in brackets. <span>(10 marks)</span></h2><p class=\"english-instruction\">Rewrite or combine each item as instructed. (1 mark each)</p><ol class=\"english-questions rewrite\"><li>The committee will have reviewed all the applications before the end of this month. <em>(Change the sentence into the passive voice.)</em></li><li>The director said to the employees, “If we had anticipated the financial difficulties, we would have adopted a different strategy.” <em>(Change the sentence into indirect speech.)</em></li><li>You must disclose the relevant information to the authorities. You must face the legal consequences of withholding it. <em>(Combine the sentences using “either … or” and “neither … nor”.)</em></li><li>Dr Elizabeth Blackwell was a pioneering physician. She became the first woman to receive a medical degree in the United States. <em>(Rewrite the sentence using a noun in apposition.)</em></li><li>The research findings challenged several long-established assumptions. They had been widely accepted by the scientific community for decades. <em>(Combine the sentences using a suitable relative pronoun.)</em></li><li>The negotiators eventually reached a mutually acceptable agreement after months of intensive discussions. <em>(Rewrite the sentence using an introductory phrase.)</em></li><li>The unexpected discovery fundamentally transformed our understanding of the ancient civilisation. <em>(Rewrite the sentence using “It was … that”.)</em></li><li>The proposal is not only financially impractical but also environmentally unsustainable. <em>(Rewrite the sentence using “not only … but also” with a different sentence structure.)</em></li><li>Although the government introduced several measures to stabilise the economy, inflation continued to rise significantly. <em>(Rewrite the sentence using “No matter”.)</em></li><li>The laboratory is situated in a remote mountainous region. The researchers conduct their most advanced experiments there. <em>(Combine the sentences using a suitable relative adverb.)</em></li></ol></div><div class=\"english-content\"><h2 class=\"english-section-title\">IV. Poetry and Comprehension <span>(10 marks)</span></h2><h3 class=\"english-subtitle\">(A) Write the appropriate words or groups of words to complete the lines of verse. <span>(5 marks)</span></h3><ol class=\"english-questions verse\"><li>Yet knowing how way leads on to way,<br>.......... if I should ever come back.</li><li>Late in .......... when the fires are out,<br>Why does he gallop and gallop about?</li><li>You cannot tell its magic<br>By the way .......... looks,</li><li>Steal from the world, and not a stone<br>Tell where ...........</li><li>Everything that books can bring<br>You'll find inside ...........</li></ol><h3 class=\"english-subtitle\">(B) Answer the questions in complete sentences. <span>(5 marks)</span></h3><ol class=\"english-questions\" start=\"6\"><li>What can cause loss of biodiversity and loss of nutrition to many local communities?</li><li>Why do parents need to talk with their children as often as possible?</li><li>What do the colours of a national flag represent?</li><li>How are AI-powered robotic boats used in the conservation of the environment?</li><li>What do these lines mean?<blockquote>Whose flocks supply him with attire;<br>Whose trees in summer yield him shade,</blockquote></li></ol></div</div>","<div class=\"english-content\">><h2 class=\"english-section-title\">V. Read the passage.</h2><div class=\"english-passage\"><p>It was a bright, cold day, the ground covered with a sleet that had frozen so that it seemed as if all the bare trees, the bushes, the cut brush, and all the grass and the bare ground had been varnished with ice. I took the young Irish setter for a little walk up the road and along a frozen creek, but it was difficult to stand or walk on the glassy surface and the red dog slipped and slithered and I fell twice, hard, once dropping my gun and having it slide away over the ice.</p><p>We flushed a covey of quail under a high clay bank with overhanging brush and I killed two as they went out of sight over the top of the bank. Some of the covey lit in trees, but most of them scattered into brush piles and it was necessary to jump on the ice-coated mounds of brush several times before they would flush. Coming out while you were poised unsteadily on the icy, springy brush, they made difficult shooting and I killed two, missed five, and started back pleased to have found a covey close to the house and happy there were so many left to find on another day.</p></div><h2 class=\"english-section-title\">V. Reading Comprehension <span>(10 marks)</span></h2><h3 class=\"english-subtitle\">(A) Write the correct word or words to complete each sentence. <span>(5 marks)</span></h3><ol class=\"english-questions\"><li>The ground was covered with a sleet that had ...........</li><li>The bare trees, bushes, cut brush, grass, and bare ground seemed to have been varnished with ...........</li><li>The young Irish setter slipped and slithered because the surface of the frozen creek was ...........</li><li>The narrator flushed a covey of quail from under a high clay bank with ...........</li><li>The narrator killed two quail, missed five, and started back feeling ...........</li></ol><h3 class=\"english-subtitle\">(B) Answer each question in one sentence. <span>(5 marks)</span></h3><ol class=\"english-questions\" start=\"6\"><li>Why was it difficult for the narrator to stand or walk on the frozen creek?</li><li>What happened to the narrator when he fell on the ice for the first time?</li><li>Where did the narrator find a covey of quail?</li><li>Why was it necessary for the narrator to jump on the ice-coated mounds of brush several times?</li><li>Why was the narrator pleased when he started back to the house?</li></ol></div><div class=\"english-content\"></div>","<div class=\"english-content\"><h2 class=\"english-section-title\">VI. Read the passage carefully.</h2><div class=\"english-passage\"><p>The history of Myanmar reflects a succession of kingdoms that shaped the country’s political institutions, cultural identity and religious traditions. From the rise of Bagan to the decline of the Konbaung dynasty, successive rulers consolidated territories, promoted Buddhism and responded to changing regional power dynamics. Although these kingdoms differed in their administration and territorial reach, each contributed to the historical foundations of modern Myanmar.</p><p>The Bagan Kingdom emerged as a major political power in the eleventh century under King Anawrahta, who is traditionally credited with <strong>unifying</strong> much of the Irrawaddy Valley. His reign strengthened Theravada Buddhism, while subsequent rulers supported the construction of monasteries, stupas and temples. Bagan consequently developed into an influential centre of religious learning, architecture and literary culture. However, prolonged military pressure, internal difficulties and the disruption associated with Mongol incursions in the late thirteenth century weakened the kingdom’s authority, contributing to its political <strong>fragmentation</strong>.</p><p>Following Bagan’s decline, several competing states emerged, including the kingdoms of Ava and Hanthawaddy, while the Shan principalities exercised considerable influence in Upper Myanmar. Political rivalry and intermittent warfare characterised much of this period. In the sixteenth century, the Taungoo dynasty expanded under King Tabinshwehti and his successor Bayinnaung, who established an extensive empire across mainland Southeast Asia. Nevertheless, the difficulty of governing distant territories and recurring rebellions undermined its cohesion. A later revival under King Nyaungyan Min and his successors restored royal authority, although the dynasty eventually collapsed in the eighteenth century.</p><p>The Konbaung dynasty was founded by Alaungpaya in 1752, following the fall of the Restored Taungoo dynasty. Through military campaigns and administrative <strong>consolidation</strong>, Alaungpaya and his successors reunified much of the country and expanded its influence into neighbouring regions. The dynasty presided over significant developments in Buddhist scholarship, literature and royal administration. However, territorial expansion brought Myanmar into increasingly intense conflict with the British East India Company and, subsequently, British colonial power. Three Anglo-Burmese Wars, fought in 1824–1826, 1852 and 1885, progressively reduced the kingdom’s independence. The final war resulted in the <strong>annexation</strong> of Upper Myanmar and the removal of King Thibaw in 1885, bringing the Konbaung dynasty to an end. Thus, the transition from Bagan to Konbaung illustrates both the <strong>resilience</strong> of Myanmar’s royal traditions and the political challenges that ultimately transformed the country’s historical trajectory.</p></div><h2 class=\"english-section-title\">VI. Reading Comprehension <span>(15 marks)</span></h2><h3 class=\"english-subtitle\">(A) Find the bold-faced words in the passage that are similar in meaning to the following. There is an extra. <span>(5 marks)</span></h3><ol class=\"english-questions\"><li>To bring separate areas or groups together under one authority = ..........</li><li>The gradual breaking apart of a political system or territory = ..........</li><li>The ability to recover quickly from difficulties or withstand adversity = ..........</li><li>The process of making something stronger or more firmly established = ..........</li><li>The act of officially taking control of a territory and incorporating it into another country = ..........</li></ol><h3 class=\"english-subtitle\">(B) Answer the following questions. Give complete answers. <span>(10 marks)</span></h3><ol class=\"english-questions\" start=\"6\"><li>How did King Anawrahta contribute to the political and religious development of the Bagan Kingdom?</li><li>What factors contributed to the decline of Bagan and the emergence of competing states in Myanmar?</li><li>How did the Taungoo dynasty establish an extensive empire, and what ultimately undermined its cohesion?</li><li>In what ways did the Konbaung dynasty strengthen Myanmar, and why did its expansion lead to conflicts with the British?</li><li>How did the three Anglo-Burmese Wars bring about the end of the Konbaung dynasty and change Myanmar’s political status?</li></ol></div></div>","<div class=\"english-content\"><h2 class=\"english-section-title\">VII. Dialogue Completion <span>(10 marks)</span></h2><h3 class=\"english-subtitle\">(A) Complete the dialogue with the expressions given in the box. There is an extra. <span>(5 marks)</span></h3><div class=\"english-dialogue-box\"><div class=\"english-dialogue-box\"><div class=\"english-wordbox\">I’m really worried about &nbsp;&nbsp;&nbsp;&nbsp; What makes you say that? &nbsp;&nbsp;&nbsp;&nbsp; You’re not alone &nbsp;&nbsp;&nbsp;&nbsp; What should we do to prepare? &nbsp;&nbsp;&nbsp;&nbsp; We still have enough time &nbsp;&nbsp;&nbsp;&nbsp; I couldn’t agree more</div></div><p class=\"english-dialogue\"><strong>Hnin Thiri:</strong> I’ve been feeling stressed about the Grade 12 examination recently. (1) .......... passing the final exam.</p><p class=\"english-dialogue\"><strong>Htwe Thiri:</strong> (2) ..........? Is it because the new Grade 12 system seems much more difficult than we expected?</p><p class=\"english-dialogue\"><strong>Hnin Thiri:</strong> Exactly! The lessons are so challenging, and I’m afraid I won’t be able to answer the questions in the final examination.</p><p class=\"english-dialogue\"><strong>Htwe Thiri:</strong> (3) ........... Many students are facing the same problem, so you shouldn’t lose confidence.</p><p class=\"english-dialogue\"><strong>Hnin Thiri:</strong> Thanks for saying that. But (4) ..........? I don’t want to waste my time studying ineffectively.</p><p class=\"english-dialogue\"><strong>Htwe Thiri:</strong> We should make a proper study timetable, practise past examination questions and ask our teachers for help whenever we don’t understand something.</p><p class=\"english-dialogue\"><strong>Hnin Thiri:</strong> That sounds reasonable. I hope I can improve before the examination.</p><p class=\"english-dialogue\"><strong>Htwe Thiri:</strong> Of course! (5) .......... if we use our time wisely and work hard every day.</p><h3 class=\"english-subtitle\">(B) Complete the exchanges, using the expressions given in the box. There is an extra. <span>(5 marks)</span></h3><div class=\"english-dialogue-box\"><div class=\"english-wordbox\">Would you mind explaining that again? &nbsp;&nbsp;&nbsp;&nbsp; I’m afraid I can’t make it &nbsp;&nbsp;&nbsp;&nbsp; That sounds like a good idea &nbsp;&nbsp;&nbsp;&nbsp; What do you think of this plan? &nbsp;&nbsp;&nbsp;&nbsp; Could you give me a hand? &nbsp;&nbsp;&nbsp;&nbsp; Never mind</div></div><ol class=\"english-questions dialogue-questions\" start=\"6\"><li><strong>A:</strong> I have to finish this science project by tomorrow, but I don’t understand the last part. ..........?<br><strong>B:</strong> Of course. Let me have a look at it.</li><li><strong>A:</strong> We could organise a study group every Saturday to prepare for our final examinations.<br><strong>B:</strong> ........... We could help one another with difficult lessons.</li><li><strong>A:</strong> The teacher explained the grammar rule, but I still don’t quite understand it. ..........?<br><strong>B:</strong> Certainly. Let me explain it with a few examples.</li><li><strong>A:</strong> Would you like to join us for a picnic this Sunday?<br><strong>B:</strong> .......... because I have to visit my grandparents.</li><li><strong>A:</strong> ..........? We could divide the work equally and finish the assignment by Friday.<br><strong>B:</strong> I think it’s practical. Let’s discuss it with the other group members.</li></ol></div>","<div class=\"english-content\"><p class=\"english-instruction\">Choose ONE situation below and write a letter. Do not write more than 300 words.</p><div class=\"english-letter-prompt\"><p>You are Aung Aung. You live at No. 25, Thiri Street, Mandalay. Write a letter to your close friend Min Min, who is studying in Yangon. In your letter, explain your worries about the difficulty of the new Grade 12 curriculum and the upcoming final examination. Ask your friend for advice on how to manage your study time effectively, prepare for difficult subjects and maintain confidence until the examination.</p></div><div class=\"english-letter-prompt\"><p>You are Hnin Hnin. You live at No. 18, Bogyoke Road, Mawlamyine. You recently purchased an AXIS-Y Dark Spot Correcting Glow Cream through the KBZPay Marketplace from an online seller. After scanning the QR code printed on the product packaging, you discovered that the product appeared to be counterfeit. Write a formal letter of complaint to the customer service department of KBZPay Marketplace. In your letter, explain when and how you purchased the product, describe how scanning the QR code raised concerns about its authenticity, and request a full refund and appropriate action against the seller.</p></div><p class=\"english-instruction\">Write an essay on ONE of the following topics. Do not write more than 500 words.</p><div class=\"english-essay-topics\"><p>The Golden Age of Ancient Myanmar: The Glory and Grandeur of Traditional Burmese Culture</p><p>The Irreplaceable Role of Teachers in the Age of Artificial Intelligence</p><p>The Person I Love and Admire Most</p></div><div class=\"essay-answer-space\" aria-hidden=\"true\"></div></div>"];}

let customMode=false,customPageCount=1;
function syncCustom(){
 const subj=document.getElementById("customSubject")?.value||"",grade=document.getElementById("customGrade")?.value||"",time=document.getElementById("customTime")?.value||"",school=document.getElementById("customSchool")?.value||"",schoolColor=document.getElementById("customSchoolColor")?.value||"#102d68",logo=document.getElementById("customLogo")?.value.trim()||"";
 const first=document.getElementById("paper1"); if(!first)return;
 const meta=first.querySelector(".custom-meta"),name=first.querySelector(".custom-school-name"),img=first.querySelector(".custom-school-head img");
 if(name){name.textContent=school||"School Name";name.style.color=schoolColor;}
 if(img){
 img.onerror=null;img.onload=null;
 img.classList.toggle("logo-empty",!logo);
 if(!logo){img.removeAttribute("src");}
 else{
  const cleanLogo=logo.replace(/\/+$/,"");
  let triedFallback=false;
  img.onload=()=>{img.classList.remove("logo-empty");};
  img.onerror=()=>{
   if(!triedFallback){
    triedFallback=true;
    const match=cleanLogo.match(/^https?:\/\/lh3\.googleusercontent\.com\/d\/([^/?#]+)/i);
    if(match){img.src="https://drive.google.com/thumbnail?id="+encodeURIComponent(match[1])+"&sz=w1000";return;}
   }
   img.classList.add("logo-empty");
  };
  img.src=cleanLogo;
 }
}
 if(meta){meta.querySelector(".custom-subject-value").textContent=subj||"________________";meta.querySelector(".custom-grade-value").textContent=grade||"__________";meta.querySelector(".custom-time-value").textContent=time||"________________";}
}
function sync(){if(customMode)syncCustom();}
function renderCustomPages(){
 const oldTexts=Array.from(papers.querySelectorAll(".custom-writing")).map(el=>el.innerHTML);
 papers.innerHTML="";
 for(let i=1;i<=customPageCount;i++){
  const p=document.createElement("article");p.className="paper custom-paper";p.id="paper"+i;
  p.innerHTML=(i===1?'<div class="custom-school-head"><img class="logo-empty" src="" alt="School logo"><div class="custom-school-name">School Name</div><div class="custom-meta"><span>Subject: <b class="custom-subject-value">________________</b></span><span style="text-align:center">Grade: <b class="custom-grade-value">__________</b></span><span style="text-align:right">Time Allowed: <b class="custom-time-value">________________</b></span></div></div>':'')+'<div class="custom-writing" contenteditable="true" spellcheck="false" aria-label="Exam paper page '+i+'">Write your questions here…</div><div class="page-num">Page '+i+'</div>';
  const writing=p.querySelector(".custom-writing");

  writing.addEventListener("focus",()=>{if(writing.textContent.trim()==="Write your questions here…")writing.textContent="";});
  papers.appendChild(p);
 }
 syncCustom();
}

// Normalize pasted questions on standard exam pages: avoid carrying oversized fonts and paragraph spacing from websites/documents.
papers.addEventListener("paste",event=>{
  const editable=event.target.closest(".blank-writing");
  if(!editable) return;
  const text=(event.clipboardData||window.clipboardData).getData("text/plain");
  if(text===undefined || text===null) return;
  event.preventDefault();
  const selection=window.getSelection();
  if(!selection || selection.rangeCount===0) return;
  const range=selection.getRangeAt(0);
  if(!editable.contains(range.startContainer) && range.startContainer!==editable) return;
  range.deleteContents();
  const fragment=document.createDocumentFragment();
  const lines=text.replace(/\\r\\n?/g,"\\n").split("\\n");
  lines.forEach((line,index)=>{
    if(index) fragment.appendChild(document.createElement("br"));
    if(line) fragment.appendChild(document.createTextNode(line));
  });
  const last=fragment.lastChild;
  range.insertNode(fragment);
  if(last){
    range.setStartAfter(last);
    range.collapse(true);
    selection.removeAllRanges();
    selection.addRange(range);
  }
});
// Blank exam pages use normal text editing; no free-positioned text blocks.
// Keep Enter inside a dialogue box; never create a new dialogue box automatically.
// Prevent the browser from splitting a dialogue-box into a second box on Enter.
papers.addEventListener("keydown",event=>{
  const box=event.target.closest(".dialogue-box");
  if(!box || event.key!=="Enter") return;
  event.preventDefault();
  const selection=window.getSelection();
  if(!selection || selection.rangeCount===0) return;
  const range=selection.getRangeAt(0);
  if(!box.contains(range.startContainer) && range.startContainer!==box) return;
  range.deleteContents();
  const br=document.createElement("br");
  range.insertNode(br);
  range.setStartAfter(br);
  range.collapse(true);
  selection.removeAllRanges();
  selection.addRange(range);
});
// Rich-text tools apply to selected editable question text and are included in PDF/PNG exports.
document.querySelectorAll(".format-btn").forEach(button=>{
  button.addEventListener("mousedown",event=>event.preventDefault());
  button.addEventListener("click",()=>{
    const command=button.dataset.command;
    if(command==="box"){wrapSelectionInBox();return;}
    if(command==="dialogue"){insertDialogueBox();return;}
    const selection=window.getSelection();
    const active=selection && selection.anchorNode ? (selection.anchorNode.nodeType===1?selection.anchorNode:selection.anchorNode.parentElement) : null;
    const editable=active && active.closest('[contenteditable="true"]');
    if(!editable || !papers.contains(editable)){
      alert("အရင်ဆုံး ပြင်ချင်တဲ့ မေးခွန်းစာသားကို select လုပ်ပါ။");
      return;
    }
    document.execCommand(command,false,null);
  });
});
function insertDialogueBox(){
  const selection=window.getSelection();
  const activeNode=selection && selection.anchorNode ? (selection.anchorNode.nodeType===1?selection.anchorNode:selection.anchorNode.parentElement) : null;
  const editable=activeNode && activeNode.closest('[contenteditable="true"]');
  if(!editable || !papers.contains(editable)){
    alert("Dialogue Box ထည့်ချင်တဲ့ အဖြေစာသားနေရာကို အရင်နှိပ်ပါ။");
    return;
  }
  const box=document.createElement("div");
  box.className="dialogue-box";
  box.contentEditable="true";
  box.setAttribute("aria-label","Blank dialogue answer box — type the answer here");
  box.textContent="";
  const range=selection.getRangeAt(0);
  range.deleteContents();
  range.insertNode(box);
  const caret=document.createRange();
  caret.selectNodeContents(box);
  caret.collapse(false);
  selection.removeAllRanges();
  selection.addRange(caret);
  box.focus();
}
function wrapSelectionInBox(){
  const selection=window.getSelection();
  if(!selection || selection.rangeCount===0 || selection.isCollapsed){
    alert("Box ထည့်ချင်တဲ့ စာသားကို အရင် select လုပ်ပါ။");
    return;
  }
  const range=selection.getRangeAt(0);
  const root=range.commonAncestorContainer.nodeType===1?range.commonAncestorContainer:range.commonAncestorContainer.parentElement;
  const editable=root && root.closest('[contenteditable="true"]');
  if(!editable || !papers.contains(editable)){
    alert("Box ထည့်မယ့် စာသားကို မေးခွန်းနေရာထဲမှာ select လုပ်ပါ။");
    return;
  }
  const span=document.createElement("span");
  span.className="inline-box";
  try{
    span.appendChild(range.extractContents());
    range.insertNode(span);
    selection.removeAllRanges();
    const nextRange=document.createRange();
    nextRange.selectNodeContents(span);
    selection.addRange(nextRange);
  }catch(error){console.error("Could not add text box",error);}
}

async function capturePaper(index){
if(typeof window.html2canvas!=="function") throw new Error("PDF/PNG capture library failed to load. Please reload the page and try again.");
if(document.fonts&&document.fonts.ready) await document.fonts.ready;
const source=document.getElementById("paper"+index);
if(!source) throw new Error("Paper "+index+" not found");
const clone=source.cloneNode(true);
try{
clone.style.setProperty("zoom","1","important");
clone.style.setProperty("transform","none","important");
clone.style.setProperty("width","794px","important");
clone.style.setProperty("height","1123px","important");
clone.style.setProperty("min-width","794px","important");
clone.style.setProperty("min-height","1123px","important");
clone.style.setProperty("max-width","794px","important");
clone.style.setProperty("max-height","1123px","important");
clone.style.setProperty("padding","53px 57px","important");
clone.style.setProperty("box-sizing","border-box","important");
clone.style.setProperty("margin","0","important");
clone.style.setProperty("box-shadow","none","important");
clone.style.setProperty("position","fixed","important");
clone.style.setProperty("left","-10000px","important");
clone.style.setProperty("top","0","important");
clone.style.setProperty("overflow","hidden","important");
clone.style.setProperty("background","#fff","important");
clone.style.setProperty("font-size","13px","important");
clone.querySelectorAll(".section").forEach(x=>x.style.setProperty("break-inside","avoid","important"));
document.body.appendChild(clone);
await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
const images=Array.from(clone.querySelectorAll("img"));
await Promise.all(images.map(async img=>{
if(img.complete) return;
await new Promise(resolve=>{
const done=()=>resolve();
img.addEventListener("load",done,{once:true});
img.addEventListener("error",done,{once:true});
setTimeout(done,2500);
});
}));
images.forEach(img=>{if(!img.complete||!img.naturalWidth) img.style.display="none";});
try{
return await html2canvas(clone,{scale:2,backgroundColor:"#fff",useCORS:true,allowTaint:false,logging:false,width:794,height:1123,windowWidth:794,windowHeight:1123,scrollX:0,scrollY:0});
}catch(firstError){
/* A remote logo without CORS permission must not block the paper export. */
images.forEach(img=>img.style.setProperty("display","none","important"));
return await html2canvas(clone,{scale:2,backgroundColor:"#fff",useCORS:true,allowTaint:false,logging:false,width:794,height:1123,windowWidth:794,windowHeight:1123,scrollX:0,scrollY:0});
}
}finally{
clone.remove();
}
}

document.getElementById("png").onclick=async()=>{
const button=document.getElementById("png"), originalLabel=button.textContent;
button.disabled=true;
try{
 const pageCount=papers.querySelectorAll(".paper").length;
 if(!pageCount) throw new Error("No pages to export");
 if(typeof window.JSZip==="undefined") throw new Error("ZIP library could not load");
 const zip=new window.JSZip();
 for(let i=1;i<=pageCount;i++){
  button.textContent="Preparing page "+i+" / "+pageCount+"…";
  const canvas=await capturePaper(i);
  const blob=await new Promise((resolve,reject)=>{
   if(!canvas.toBlob){reject(new Error("PNG export is unsupported in this browser"));return;}
   canvas.toBlob(b=>b?resolve(b):reject(new Error("PNG creation failed")),"image/png");
  });
  zip.file((subject||"Exam")+"-Page-"+String(i).padStart(2,"0")+".png",blob,{binary:true});
  canvas.width=1;canvas.height=1;
 }
 button.textContent="Packing separate PNG files…";
 const archive=await zip.generateAsync({type:"blob",compression:"STORE"});
 const url=URL.createObjectURL(archive);
 const a=document.createElement("a");
 a.href=url;a.download=(subject||"Exam")+"-Separate-Page-PNGs.zip";
 a.style.position="fixed";a.style.left="-9999px";
 document.body.appendChild(a);
 a.click();
 setTimeout(()=>{a.remove();URL.revokeObjectURL(url);},120000);
}catch(error){
 console.error("PNG export failed:",error);
 alert("PNG မထုတ်နိုင်ပါ။ "+(error&&error.message?error.message:"Browser ပြဿနာရှိနိုင်ပါသည်။")+"\nRefresh လုပ်ပြီး ထပ်စမ်းကြည့်ပါ။");
}finally{
 button.disabled=false;button.textContent=originalLabel;
}
};
